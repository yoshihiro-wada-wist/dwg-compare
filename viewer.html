<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DWG Compare</title>
  <link rel="icon" type="image/png" href="icons/icon32.png" />
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <header class="toolbar">
    <div class="files">
      <label class="filebtn">
        旧図 (A)
        <input type="file" id="fileA" accept=".dwg" />
        <span class="fname" id="nameA">未選択</span>
      </label>
      <label class="filebtn">
        新図 (B)
        <input type="file" id="fileB" accept=".dwg" />
        <span class="fname" id="nameB">未選択</span>
      </label>
      <button id="compareBtn" class="primary" disabled>比較</button>
    </div>

    <div class="toggles">
      <label class="chip removed"><input type="checkbox" id="tRemoved" checked /> 削除 <b id="cRemoved">0</b></label>
      <label class="chip added"><input type="checkbox" id="tAdded" checked /> 追加 <b id="cAdded">0</b></label>
      <label class="chip common"><input type="checkbox" id="tCommon" checked /> 共通 <b id="cCommon">0</b></label>
      <label class="tol">許容差
        <input type="number" id="tol" value="0.01" step="0.001" min="0" />
      </label>
      <button id="fitBtn">全体表示</button>
      <button id="printBtn" disabled>印刷</button>
    </div>
  </header>

  <main>
    <canvas id="canvas"></canvas>
    <div id="overlay" class="overlay">
      <div class="hint">
        <h1>DWG 重ね合わせ差分ビューア</h1>
        <p>旧図(A)と新図(B)のDWGを選んで「比較」を押してください。</p>
        <p class="small">解析・描画はすべてこのブラウザ内で完結し、ファイルは外部に送信されません。</p>
      </div>
    </div>
    <div id="status" class="status"></div>
  </main>

  <!-- 印刷用エリア（画面では非表示、@media print でのみ表示） -->
  <div id="printArea" aria-hidden="true">
    <div class="print-header">
      <h1>DWG 重ね合わせ差分</h1>
      <div class="print-meta">
        <div>旧図(A)：<span id="pNameA"></span></div>
        <div>新図(B)：<span id="pNameB"></span></div>
      </div>
      <div class="print-legend">
        <span class="pl removed">■ 削除 <b id="pRemoved">0</b></span>
        <span class="pl added">■ 追加 <b id="pAdded">0</b></span>
        <span class="pl common">■ 共通 <b id="pCommon">0</b></span>
      </div>
    </div>
    <img id="printImg" alt="差分図" />
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
